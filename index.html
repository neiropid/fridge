<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Наш Холодильник</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        :root {
            --bg: #F6F7F9;
            --surface: #FFFFFF;
            --surface-soft: #F3F4F6;
            --card-stock: #E8F5E9;
            --card-stock-border: #9CCC9E;
            --card-buy: #FFF3E0;
            --card-buy-border: #FFB74D;
            --card-catalog: #FFFFFF;
            --card-catalog-border: #E5E7EB;
            --card-inner-bg: rgba(255, 255, 255, 0.85);
            --card-inner-border: rgba(0, 0, 0, 0.06);
            --text-main: #18181B;
            --text-muted: #6B7280;
            --border-subtle: #E5E7EB;
            --border-input: #D1D5DB;
            --danger: #DC2626;
            --primary: #2563EB;
            --catalog-pick-bg: #EFF6FF;
            --success: #059669;
            --toast-bg: #FFFFFF;
            --toast-border: #F59E0B;
            --toast-track: #FEF3C7;
            --toast-bar: #F59E0B;
            --save-bar-bg: #18181B;
            --save-bar-text: #FFFFFF;
            --modal-bg: #FFFFFF;
            --radius: 18px;
        }

        body.dark-theme {
            --bg: #0F1115;
            --surface: #181B21;
            --surface-soft: #232730;
            --card-stock: #15291C;
            --card-stock-border: #2B593B;
            --card-buy: #2B2012;
            --card-buy-border: #7C531E;
            --card-catalog: #181B21;
            --card-catalog-border: #2C313C;
            --card-inner-bg: rgba(15, 17, 21, 0.68);
            --card-inner-border: rgba(255, 255, 255, 0.08);
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --border-subtle: #2C313C;
            --border-input: #374151;
            --danger: #F87171;
            --primary: #3B82F6;
            --catalog-pick-bg: #1E293B;
            --success: #10B981;
            --toast-bg: #1C2028;
            --toast-border: #D97706;
            --toast-track: #3B2810;
            --toast-bar: #F59E0B;
            --save-bar-bg: #232730;
            --save-bar-text: #F9FAFB;
            --modal-bg: #181B21;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 120px;
            max-width: 1240px;
            margin: 0 auto;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: var(--text-main);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-btn {
            background: var(--surface);
            color: var(--text-main);
            border: 1.5px solid var(--border-input);
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            min-height: 44px;
            white-space: nowrap;
        }

        .add-btn {
            background: var(--primary);
            color: #FFFFFF;
            border: none;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            min-height: 44px;
            white-space: nowrap;
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab-btn {
            min-height: 46px;
            border: 1.5px solid var(--border-subtle);
            background: var(--surface);
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .tab-btn.active {
            background: var(--text-main);
            color: var(--surface);
            border-color: var(--text-main);
        }

        .search-wrap {
            position: relative;
            margin-bottom: 14px;
        }

        .search-input {
            width: 100%;
            min-height: 46px;
            padding: 10px 40px 10px 14px;
            border-radius: 14px;
            border: 1.5px solid var(--border-subtle);
            background: var(--surface);
            font-size: 15px;
            color: var(--text-main);
            outline: none;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .search-clear {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border: none;
            background: var(--surface-soft);
            color: var(--text-muted);
            border-radius: 999px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: none;
        }

        .search-clear.visible {
            display: block;
        }

        .toast-stack {
            position: fixed;
            top: 12px;
            right: 12px;
            left: 12px;
            z-index: 150;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        @media (min-width: 640px) {
            .toast-stack {
                left: auto;
                width: 340px;
            }
        }

        .toast-item {
            pointer-events: auto;
            position: relative;
            overflow: hidden;
            background: var(--toast-bg);
            border: 1.5px solid var(--toast-border);
            border-radius: 14px;
            padding: 10px 12px 14px 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            transform: translateX(24px);
            opacity: 0;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .toast-item.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast-item.leaving {
            transform: translateY(-18px);
            opacity: 0;
        }

        .toast-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.25;
        }

        .toast-yes {
            min-height: 34px;
            padding: 6px 12px;
            border-radius: 10px;
            border: none;
            background: #D97706;
            color: #FFFFFF;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            flex-shrink: 0;
        }

        .toast-timer-track {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 4px;
            background: var(--toast-track);
        }

        .toast-timer-bar {
            height: 100%;
            width: 100%;
            background: var(--toast-bar);
            transform-origin: left center;
            transition: transform linear;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 640px) {
            .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
        }

        @media (min-width: 1024px) {
            .grid { grid-template-columns: repeat(5, 1fr); gap: 16px; }
        }

        .card {
            border-radius: var(--radius);
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1.5px solid var(--card-catalog-border);
            background: var(--card-catalog);
            color: var(--text-main);
            position: relative;
            min-height: 185px;
        }

        .card.in_stock {
            background-color: var(--card-stock);
            border-color: var(--card-stock-border);
        }

        .card.to_buy {
            background-color: var(--card-buy);
            border-color: var(--card-buy-border);
        }

        .card.expired_card {
            border-color: var(--danger);
            box-shadow: 0 0 0 1px rgba(220, 38, 38, 0.3);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 10px;
        }

        .art-box {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--card-inner-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid var(--card-inner-border);
        }

        .art-box svg {
            width: 34px;
            height: 34px;
        }

        .del-x-btn {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            border: 1px solid rgba(220, 38, 38, 0.35);
            background: var(--card-inner-bg);
            color: var(--danger);
            font-size: 20px;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 5px 8px;
            border-radius: 9px;
            background: var(--card-inner-bg);
            color: var(--text-muted);
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 8px;
            color: var(--text-main);
            word-break: break-word;
        }

        .catalog-pick-btn {
            width: 100%;
            min-height: 42px;
            border-radius: 12px;
            border: none;
            background: var(--catalog-pick-bg);
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }

        .amount-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            background: var(--card-inner-bg);
            padding: 6px;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .step-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border-input);
            background: var(--surface);
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .amount-text {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-main);
            text-align: center;
            cursor: pointer;
            padding: 4px;
            flex: 1;
        }

        .edit-vol-btn {
            min-height: 36px;
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid var(--border-input);
            background: var(--surface);
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            flex-shrink: 0;
        }

        .expiry-line {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .expiry-line.urgent {
            color: var(--danger);
            font-weight: 800;
        }

        .bought-btn {
            width: 100%;
            min-height: 42px;
            border-radius: 12px;
            border: none;
            background: var(--success);
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .save-bar {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(160%);
            background: var(--save-bar-bg);
            color: var(--save-bar-text);
            border: 1px solid var(--border-input);
            padding: 12px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
            transition: transform 0.25s ease;
            z-index: 100;
            width: calc(100% - 24px);
            max-width: 480px;
        }

        .save-bar.visible {
            transform: translateX(-50%) translateY(0);
        }

        .save-status {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.25;
        }

        .save-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-confirm {
            min-height: 40px;
            padding: 8px 16px;
            border-radius: 12px;
            border: none;
            background: #10B981;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-cancel {
            min-height: 40px;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-input);
            background: transparent;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 200;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--modal-bg);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            padding: 20px;
            border-radius: 22px;
            width: 100%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 {
            font-size: 19px;
            margin-bottom: 14px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border: 1.5px solid var(--border-input);
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-main);
            background: var(--surface-soft);
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .target-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin-top: 14px;
            margin-bottom: 8px;
        }

        .target-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-to-stock {
            min-height: 44px;
            border-radius: 12px;
            border: 1.5px solid var(--card-stock-border);
            background: var(--card-stock);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-to-buy {
            min-height: 44px;
            border-radius: 12px;
            border: 1.5px solid var(--card-buy-border);
            background: var(--card-buy);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .modal-foot {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-secondary {
            min-height: 44px;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-input);
            background: var(--surface);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 16px;
            color: var(--text-muted);
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div id="toastStack" class="toast-stack"></div>

    <header>
        <h1>🧊 Холодильник</h1>
        <div class="header-actions">
            <button id="themeBtn" class="theme-btn" type="button" onclick="toggleTheme()">🌙 Тёмная</button>
            <button class="add-btn" type="button" onclick="openCreateModal()">+ Свой продукт</button>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" data-tab="in_stock" onclick="switchTab('in_stock')">Запасы</button>
        <button class="tab-btn" data-tab="to_buy" onclick="switchTab('to_buy')">Купить</button>
        <button class="tab-btn" data-tab="catalog" onclick="switchTab('catalog')">Все</button>
    </div>

    <div class="search-wrap">
        <input id="searchInput" class="search-input" type="search" placeholder="Поиск продукта..." oninput="handleSearch()">
        <button id="searchClear" class="search-clear" onclick="clearSearch()">×</button>
    </div>

    <div id="grid" class="grid">
        <div class="empty-state">Загрузка данных...</div>
    </div>

    <div id="saveBar" class="save-bar">
        <span id="saveStatusText" class="save-status">Есть несохранённые правки</span>
        <div class="save-actions">
            <button class="btn-cancel" onclick="discardChanges()">Отмена</button>
            <button class="btn-confirm" onclick="saveChanges()">Сохранить</button>
        </div>
    </div>

    <!-- Модалка объёма и срока годности -->
    <div id="actionModal" class="modal-overlay">
        <div class="modal">
            <h2 id="actionTitle">Параметры продукта</h2>
            <input type="hidden" id="actionItemId">
            <input type="hidden" id="actionMode">

            <div class="row-2">
                <div class="form-group">
                    <label>Количество</label>
                    <input type="number" step="0.1" min="0" id="actionAmount">
                </div>
                <div class="form-group">
                    <label>Единица измерения</label>
                    <select id="actionUnit">
                        <option value="шт">шт</option>
                        <option value="кг">кг</option>
                        <option value="г">г</option>
                        <option value="л">л</option>
                        <option value="мл">мл</option>
                        <option value="уп">уп</option>
                    </select>
                </div>
            </div>

            <div id="expiryField" class="form-group">
                <label>Годен до</label>
                <input type="date" id="actionExpiry">
            </div>

            <div class="modal-foot">
                <button type="button" class="btn-secondary" onclick="closeActionModal()">Отмена</button>
                <button type="button" class="add-btn" onclick="confirmActionModal()">Подтвердить</button>
            </div>
        </div>
    </div>

    <!-- Модалка создания своего продукта -->
    <div id="createModal" class="modal-overlay">
        <div class="modal">
            <h2>Новый продукт</h2>

            <div class="form-group">
                <label>Название</label>
                <input type="text" id="newName" placeholder="Например: Соевый соус или Лимонад">
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label>Количество</label>
                    <input type="number" step="0.1" min="0" id="newAmount" value="1">
                </div>
                <div class="form-group">
                    <label>Единица измерения</label>
                    <select id="newUnit">
                        <option value="шт">шт</option>
                        <option value="кг">кг</option>
                        <option value="г">г</option>
                        <option value="л">л</option>
                        <option value="мл">мл</option>
                        <option value="уп">уп</option>
                    </select>
                </div>
            </div>

            <span class="target-label">Добавить в</span>
            <div class="target-buttons">
                <button type="button" class="btn-to-stock" onclick="createCustomItem('in_stock')">Запасы</button>
                <button type="button" class="btn-to-buy" onclick="createCustomItem('to_buy')">Купить</button>
            </div>

            <div class="modal-foot">
                <button type="button" class="btn-secondary" onclick="closeCreateModal()">Отмена</button>
            </div>
        </div>
    </div>

        function capitalizeFirst(str) {
            const trimmed = String(str || '').trim();
            if (!trimmed) return 'Без названия';

            return trimmed.charAt(0).toLocaleUpperCase('ru-RU') + trimmed.slice(1);

            if (saved === 'dark' || saved === 'light') {
                applyTheme(saved);
            } else {
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(prefersDark ? 'dark' : 'light');
            }
        }

        function detectArtByName(rawName) {
            const name = (rawName || '').toLowerCase();
            if (name.includes('рыб') || name.includes('лосос') || name.includes('минтай') || name.includes('кревет') || name.includes('тунец')) return 'fish';
            if (name.includes('мяс') || name.includes('говяд') || name.includes('свин') || name.includes('куриц') || name.includes('филе') || name.includes('бёдр') || name.includes('индейк') || name.includes('фарш') || name.includes('бекон') || name.includes('сосис') || name.includes('колбас')) return 'meat';
            if (name.includes('яйц')) return 'eggs';
            if (name.includes('сыр') || name.includes('масл')) return 'cheese';
            if (name.includes('молок') || name.includes('кефир') || name.includes('ряженк') || name.includes('сметан') || name.includes('творог') || name.includes('йогурт')) return 'milk';
            if (name.includes('соус') || name.includes('кетчуп') || name.includes('майонез') || name.includes('горчиц') || name.includes('паст') || name.includes('уксус') || name.includes('спец') || name.includes('приправ')) return 'sauce';
            if (name.includes('вод') || name.includes('лимонад') || name.includes('кол') || name.includes('сок') || name.includes('чай') || name.includes('кофе') || name.includes('напит')) return 'drink';
            if (name.includes('хлеб') || name.includes('батон') || name.includes('лаваш') || name.includes('булк')) return 'bread';
            if (name.includes('чипс') || name.includes('сухар') || name.includes('орех') || name.includes('шоколад') || name.includes('печен')) return 'snack';
            if (name.includes('рис') || name.includes('греч') || name.includes('макарон') || name.includes('овсян') || name.includes('мук') || name.includes('сахар') || name.includes('сол')) return 'grain';
            return 'veg';
        }

        function mergeCatalogWithItems(items) {
            const existingNames = new Set(items.map(i => i.name.toLowerCase()));
            const extraDefaults = DEFAULT_CATALOG
                .filter(d => !existingNames.has(d.name.toLowerCase()))
                .map(normalizeItem);
            return [...items, ...extraDefaults];
        }

        function normalizeItem(raw) {
            const isVirtualDefault = Number(raw.id) < -100;
            return {
                id: raw.id,
                isNew: Boolean(raw.isNew || isVirtualDefault),
                name: capitalizeFirst(raw.name || 'Без названия'),
                icon: raw.icon || raw.art || detectArtByName(raw.name),
                amount: Number(raw.amount) || 0,
                unit: raw.unit || 'шт',
                status: raw.status || 'catalog',
                expiry: raw.expiry || null
            };
        }

        function readLocalCache() {
            try {
                const raw = localStorage.getItem(CACHE_STORAGE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) && parsed.length > 0 ? parsed.map(normalizeItem) : null;
            } catch (_) {
                return null;
            }
        }

        function writeLocalCache(items) {
            try {
                localStorage.setItem(CACHE_STORAGE_KEY, JSON.stringify(items));
            } catch (_) {}
        }

        function isExpiredOrSoon(dateStr) {
            if (!dateStr || String(dateStr).startsWith('cat:')) return { text: 'Срок не указан', urgent: false, expired: false };
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const exp = new Date(dateStr + 'T00:00:00');
            if (isNaN(exp.getTime())) return { text: 'Срок не указан', urgent: false, expired: false };
            const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
            const formatted = exp.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
            if (diffDays < 0) return { text: `Просрочено (${formatted})`, urgent: true, expired: true };
            if (diffDays <= 2) return { text: `До ${formatted} (скоро)`, urgent: true, expired: false };
            return { text: `До ${formatted}`, urgent: false, expired: false };
        }

        function clearAllToasts() {
            activeToasts.forEach(t => {
                if (t.timerId) clearTimeout(t.timerId);
                if (t.el && t.el.parentNode) t.el.remove();
            });
            activeToasts = [];
        }

        function removeToast(toastObj, animateOut = true) {
            if (!toastObj) return;
            if (toastObj.timerId) clearTimeout(toastObj.timerId);
            activeToasts = activeToasts.filter(t => t !== toastObj);
            if (!toastObj.el) return;
            if (!animateOut) {
                toastObj.el.remove();
                return;
            }
            toastObj.el.classList.add('leaving');
            setTimeout(() => {
                if (toastObj.el && toastObj.el.parentNode) toastObj.el.remove();
            }, 220);
        }

        function spawnDepletedToast(itemId, itemName, restoreAmount) {
            const stack = document.getElementById('toastStack');
            const labelName = capitalizeFirst(itemName);

            while (activeToasts.length >= MAX_TOASTS) {
                removeToast(activeToasts[0], true);
            }

            const el = document.createElement('div');
            el.className = 'toast-item';
            el.innerHTML = `
                <div class="toast-label">Добавить в «Купить»<br>«${labelName}»?</div>
                <button class="toast-yes" type="button">Да</button>
                <div class="toast-timer-track"><div class="toast-timer-bar"></div></div>
            `;

            const toastObj = { id: itemId, el, timerId: null };
            const yesBtn = el.querySelector('.toast-yes');
            const bar = el.querySelector('.toast-timer-bar');

            yesBtn.onclick = () => {
                const target = draftItems.find(i => i.id === itemId);
                if (target) {
                    target.status = 'to_buy';
                    target.amount = restoreAmount > 0 ? restoreAmount : 1;
                    setUnsaved(true, 'Есть несохранённые правки');
                    render();
                }
                removeToast(toastObj, false);
            };

            stack.appendChild(el);
            activeToasts.push(toastObj);

            requestAnimationFrame(() => {
                el.classList.add('show');
                bar.style.transitionDuration = `${TOAST_DURATION_MS}ms`;
                requestAnimationFrame(() => {
                    bar.style.transform = 'scaleX(0)';
                });
            });

            toastObj.timerId = setTimeout(() => {
                removeToast(toastObj, true);
            }, TOAST_DURATION_MS);
        }

        function loadFallbackCatalog(keepUnsaved = false, statusMsg = 'Есть несохранённые правки') {
            const cached = readLocalCache();
            const base = mergeCatalogWithItems(cached || DEFAULT_CATALOG.map(normalizeItem));
            originalItems = JSON.parse(JSON.stringify(base));
            draftItems = JSON.parse(JSON.stringify(base));
            deletedIds = [];
            clearAllToasts();
            setUnsaved(keepUnsaved, statusMsg);
            render();
        }

        async function fetchItems() {
            const cached = readLocalCache();
            if (cached && draftItems.length === 0) {
                const mergedCached = mergeCatalogWithItems(cached);
                originalItems = JSON.parse(JSON.stringify(mergedCached));
                draftItems = JSON.parse(JSON.stringify(mergedCached));
                render();
            }

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/fridge_items?select=*&order=id.asc`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!Array.isArray(data)) throw new Error('Bad response');

                if (data.length === 0) {
                    loadFallbackCatalog(true, 'Локальный каталог готов — нажми «Сохранить»');
                    return;
                }

                const normalized = mergeCatalogWithItems(data.map(normalizeItem));
                originalItems = JSON.parse(JSON.stringify(normalized));
                draftItems = JSON.parse(JSON.stringify(normalized));
                deletedIds = [];
                writeLocalCache(normalized);
                clearAllToasts();
                setUnsaved(false);
                render();
            } catch (err) {
                loadFallbackCatalog(false);
            }
        }

        function getScaledNextAmount(current, unit, dir) {
            const val = Number(current) || 0;
            if (unit === 'л' || unit === 'кг') {
                if (dir < 0) {
                    if (val > 1) return Math.round((val - 0.5) * 100) / 100;
                    if (val > 0.8) return 0.8;
                    if (val > 0.5) return 0.5;
                    if (val > 0.2) return 0.2;
                    return 0;
                } else {
                    if (val < 0.2) return 0.2;
                    if (val < 0.5) return 0.5;
                    if (val < 0.8) return 0.8;
                    if (val < 1) return 1;
                    return Math.round((val + 0.5) * 100) / 100;
                }
            }
            if (unit === 'г' || unit === 'мл') {
                const step = 100;
                return Math.max(0, val + dir * step);
            }
            return Math.max(0, Math.round((val + dir * 1) * 100) / 100);
        }

        function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            const items = draftItems.filter(item => {
                if (currentTab === 'in_stock' && item.status !== 'in_stock') return false;
                if (currentTab === 'to_buy' && item.status !== 'to_buy') return false;
                if (searchQuery && !item.name.toLowerCase().includes(searchQuery)) return false;
                return true;
            });

            if (items.length === 0) {
                grid.innerHTML = '<div class="empty-state">Здесь пока пусто</div>';
                return;

            items.forEach(item => {
                const title = capitalizeFirst(item.name);

                                <span class="amount-text" onclick="openActionModal(${item.id}, 'edit_stock')">${item.amount} ${item.unit}</span>
                                <button class="step-btn" onclick="stepAmount(${item.id}, 1)">+</button>
                            </div>
                            <div class="expiry-line ${exp.urgent ? 'urgent' : ''}" onclick="openActionModal(${item.id}, 'edit_stock')" style="cursor:pointer;">
                                <span>${exp.text}</span>
                                <span>📅</span>
                            </div>
                        </div>
                    `;
                } else if (currentTab === 'to_buy') {
                    card.innerHTML = `
                        <div>
                            <div class="card-top">
                                <div class="art-box">${renderArt(item.icon)}</div>
                                <button class="del-x-btn" title="Убрать из списка" onclick="removeFromBuy(${item.id})">×</button>
                            </div>
                            <div class="card-title">${title}</div>
                        </div>
                        <div>
                            <div class="amount-row">
                                <span class="amount-text" style="text-align:left;padding-left:6px;">${item.amount} ${item.unit}</span>
                                <button class="edit-vol-btn" onclick="openActionModal(${item.id}, 'edit_buy')">Изм. объём</button>
                            </div>
                            <button class="bought-btn" onclick="openActionModal(${item.id}, 'mark_bought')">Куплено → в запасы</button>
                        </div>
                    `;
                } else {
                    const stateText = item.status === 'in_stock' ? 'В запасах' : (item.status === 'to_buy' ? 'В «Купить»' : 'В каталоге');
                    card.innerHTML = `
                        <div>
                            <div class="card-top">
                                <div class="art-box">${renderArt(item.icon)}</div>
                                <span class="badge-tag">${stateText}</span>
                            </div>
                            <div class="card-title">${title}</div>
                        </div>
                        <div>
                            <button class="catalog-pick-btn" onclick="openActionModal(${item.id}, 'pick_to_buy')">+ В «Купить»</button>
                        </div>
                    `;
                }

                grid.appendChild(card);
            });
        }

        function stepAmount(id, dir) {
            const item = draftItems.find(i => i.id === id);
            if (!item) return;
            const prevAmount = item.amount;
            const nextVal = getScaledNextAmount(item.amount, item.unit, dir);

            if (dir < 0 && nextVal === 0 && item.status === 'in_stock') {
                item.amount = 0;
                item.status = 'catalog';
                item.expiry = null;
                spawnDepletedToast(item.id, item.name, prevAmount > 0 ? prevAmount : 1);
                setUnsaved(true, 'Есть несохранённые правки');
                render();
                return;
            }

            item.amount = nextVal;
            setUnsaved(true, 'Есть несохранённые правки');
            render();
        }

        function removeFromBuy(id) {
            const item = draftItems.find(i => i.id === id);
            if (!item) return;
            item.status = 'catalog';
            setUnsaved(true, 'Есть несохранённые правки');
            render();
        }

        function openActionModal(id, mode) {
            const item = draftItems.find(i => i.id === id);
            if (!item) return;
            const title = capitalizeFirst(item.name);

            document.getElementById('actionItemId').value = id;
            document.getElementById('actionMode').value = mode;
            document.getElementById('actionAmount').value = item.amount > 0 ? item.amount : 1;
            document.getElementById('actionUnit').value = item.unit || 'шт';

            const expiryField = document.getElementById('expiryField');
            const expiryInput = document.getElementById('actionExpiry');

            if (mode === 'pick_to_buy') {
                document.getElementById('actionTitle').innerText = `Купить: ${title}`;
                expiryField.style.display = 'none';
            } else if (mode === 'edit_buy') {
                document.getElementById('actionTitle').innerText = `Объём покупки: ${title}`;
                expiryField.style.display = 'none';
            } else if (mode === 'mark_bought') {
                document.getElementById('actionTitle').innerText = `В запасы: ${title}`;
                expiryField.style.display = 'block';
                expiryInput.value = (item.expiry && !String(item.expiry).startsWith('cat:')) ? item.expiry : '';
            } else {
                document.getElementById('actionTitle').innerText = `Изменить: ${title}`;
                expiryField.style.display = 'block';
                expiryInput.value = (item.expiry && !String(item.expiry).startsWith('cat:')) ? item.expiry : '';
            }

            document.getElementById('actionModal').classList.add('open');
        }

        function closeActionModal() {
            document.getElementById('actionModal').classList.remove('open');
        }

        function confirmActionModal() {
            const id = Number(document.getElementById('actionItemId').value);
            const mode = document.getElementById('actionMode').value;
            const item = draftItems.find(i => i.id === id);
            if (!item) return;

            const amt = Math.max(0, parseFloat(document.getElementById('actionAmount').value) || 0);
            const unit = document.getElementById('actionUnit').value;
            const expVal = document.getElementById('actionExpiry').value;

            item.amount = amt;
            item.unit = unit;

            if (mode === 'pick_to_buy' || mode === 'edit_buy') {
                item.status = 'to_buy';
                const matchedToast = activeToasts.find(t => t.id === id);
                if (matchedToast) removeToast(matchedToast, false);
            } else if (mode === 'mark_bought' || mode === 'edit_stock') {
                item.status = 'in_stock';
                item.expiry = expVal || null;
            }

            setUnsaved(true, 'Есть несохранённые правки');
            closeActionModal();
            render();
        }

        function openCreateModal() {
            document.getElementById('newName').value = '';
            document.getElementById('newAmount').value = '1';
            document.getElementById('newUnit').value = 'шт';
            document.getElementById('createModal').classList.add('open');
            setTimeout(() => document.getElementById('newName').focus(), 50);
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.remove('open');
        }

        function createCustomItem(targetStatus) {
            const rawName = document.getElementById('newName').value.trim();
            if (!rawName) return;

            const name = capitalizeFirst(rawName);
            const art = detectArtByName(name);
            const amount = Math.max(0, parseFloat(document.getElementById('newAmount').value) || 0);
            const unit = document.getElementById('newUnit').value;

            draftItems.push({
                id: -Date.now(),
                isNew: true,
                name,
                icon: art,
                amount: amount > 0 ? amount : 1,
                unit,
                status: targetStatus,
                expiry: null
            });

            setUnsaved(true, 'Есть несохранённые правки');
            closeCreateModal();
            render();
        }

        function discardChanges() {
            draftItems = JSON.parse(JSON.stringify(originalItems));
            deletedIds = [];
            writeLocalCache(originalItems);
            clearAllToasts();
            setUnsaved(false);
            render();
        }

        async function saveChanges() {
            const btn = document.querySelector('.btn-confirm');
            btn.disabled = true;
            btn.innerText = 'Сохранение...';
            writeLocalCache(draftItems);

            const headers = {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json'
            };

            let syncedOk = true;

            try {
                for (const id of deletedIds) {
                    if (Number(id) > 0) {
                        const delRes = await fetch(`${SUPABASE_URL}/rest/v1/fridge_items?id=eq.${id}`, {
                            method: 'DELETE',
                            headers
                        });
                        if (!delRes.ok) syncedOk = false;
                    }
                }

                for (const item of draftItems) {
                    const payload = {
                        name: capitalizeFirst(item.name),
                        icon: item.icon,
                        amount: item.amount,
                        unit: item.unit,
                        status: item.status,
                        expiry: item.expiry
                    };

                    if (item.isNew || Number(item.id) < 0) {
                        const postRes = await fetch(`${SUPABASE_URL}/rest/v1/fridge_items`, {
                            method: 'POST',
                            headers: {
                                ...headers,
                                'Prefer': 'return=representation'
                            },
                            body: JSON.stringify(payload)
                        });
                        if (postRes.ok) {
                            const created = await postRes.json();
                            if (Array.isArray(created) && created[0] && created[0].id) {
                                item.id = created[0].id;
                                item.isNew = false;
                            }
                        } else {
                            syncedOk = false;
                        }
                    } else {
                        const patchRes = await fetch(`${SUPABASE_URL}/rest/v1/fridge_items?id=eq.${item.id}`, {
                            method: 'PATCH',
                            headers,
                            body: JSON.stringify(payload)
                        });
                        if (!patchRes.ok) syncedOk = false;
                    }
                }

                if (syncedOk) {
                    deletedIds = [];
                    originalItems = JSON.parse(JSON.stringify(draftItems));
                    writeLocalCache(draftItems);
                    clearAllToasts();
                    setUnsaved(false);
                } else {
                    setUnsaved(true, 'Сохранено локально (ошибка сети)');
                }
            } catch (e) {
                setUnsaved(true, 'Сохранено локально (нет связи)');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Сохранить';
            }
        }

        initTheme();
        fetchItems();
    </script>
</body>
</html>
