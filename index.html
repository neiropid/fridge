<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Наш Холодильник</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        :root {
            --bg: #F6F7F9;
            --surface: #FFFFFF;
            --card-stock: #E8F5E9;
            --card-stock-border: #9CCC9E;
            --card-buy: #FFF3E0;
            --card-buy-border: #FFB74D;
            --card-catalog: #FFFFFF;
            --card-catalog-border: #E5E7EB;
            --text-main: #18181B;
            --text-muted: #6B7280;
            --danger: #DC2626;
            --primary: #2563EB;
            --success: #059669;
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 120px;
            max-width: 1240px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        .add-btn {
            background: var(--primary);
            color: #FFFFFF;
            border: none;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            min-height: 44px;
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab-btn {
            min-height: 46px;
            border: 1.5px solid #E5E7EB;
            background: var(--surface);
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .tab-btn.active {
            background: var(--text-main);
            color: #FFFFFF;
            border-color: var(--text-main);
        }

        .search-wrap {
            position: relative;
            margin-bottom: 12px;
        }

        .search-input {
            width: 100%;
            min-height: 46px;
            padding: 10px 40px 10px 14px;
            border-radius: 14px;
            border: 1.5px solid #E5E7EB;
            background: var(--surface);
            font-size: 15px;
            color: var(--text-main);
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .search-clear {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border: none;
            background: #F3F4F6;
            color: var(--text-muted);
            border-radius: 999px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: none;
        }

        .search-clear.visible {
            display: block;
        }

        .subcats {
            display: none;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 14px;
            scrollbar-width: none;
        }

        .subcats::-webkit-scrollbar {
            display: none;
        }

        .subcats.visible {
            display: flex;
        }

        .subcat-btn {
            flex: 0 0 auto;
            min-height: 38px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid #D1D5DB;
            background: var(--surface);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .subcat-btn.active {
            background: #2563EB;
            color: #FFFFFF;
            border-color: #2563EB;
        }

        /* Каскад компактных тостов с таймером сверху */
        .toast-stack {
            position: fixed;
            top: 12px;
            right: 12px;
            left: 12px;
            z-index: 150;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        @media (min-width: 640px) {
            .toast-stack {
                left: auto;
                width: 340px;
            }
        }

        .toast-item {
            pointer-events: auto;
            position: relative;
            overflow: hidden;
            background: #FFFFFF;
            border: 1.5px solid #F59E0B;
            border-radius: 14px;
            padding: 10px 12px 14px 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            transform: translateX(24px);
            opacity: 0;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .toast-item.show {
            transform: translateX(0);
            opacity: 1;
        }

        .toast-item.leaving {
            transform: translateY(-18px);
            opacity: 0;
        }

        .toast-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.25;
        }

        .toast-yes {
            min-height: 34px;
            padding: 6px 12px;
            border-radius: 10px;
            border: none;
            background: #D97706;
            color: #FFFFFF;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            flex-shrink: 0;
        }

        .toast-timer-track {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 4px;
            background: #FEF3C7;
        }

        .toast-timer-bar {
            height: 100%;
            width: 100%;
            background: #F59E0B;
            transform-origin: left center;
            transition: transform linear;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 640px) {
            .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
        }

        @media (min-width: 1024px) {
            .grid { grid-template-columns: repeat(5, 1fr); gap: 16px; }
        }

        .card {
            border-radius: var(--radius);
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1.5px solid var(--card-catalog-border);
            background: var(--card-catalog);
            position: relative;
            min-height: 185px;
        }

        .card.in_stock {
            background-color: var(--card-stock);
            border-color: var(--card-stock-border);
        }

        .card.to_buy {
            background-color: var(--card-buy);
            border-color: var(--card-buy-border);
        }

        .card.expired_card {
            border-color: #F87171;
            box-shadow: 0 0 0 1px rgba(220, 38, 38, 0.25);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 10px;
        }

        .art-box {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        .art-box svg {
            width: 34px;
            height: 34px;
        }

        .del-x-btn {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            border: 1px solid rgba(220, 38, 38, 0.25);
            background: rgba(255, 255, 255, 0.92);
            color: var(--danger);
            font-size: 20px;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 5px 8px;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.85);
            color: var(--text-muted);
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .catalog-pick-btn {
            width: 100%;
            min-height: 42px;
            border-radius: 12px;
            border: none;
            background: #EFF6FF;
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }

        .amount-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            background: rgba(255, 255, 255, 0.82);
            padding: 6px;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .step-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid #E5E7EB;
            background: #FFFFFF;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .amount-text {
            font-size: 14px;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            padding: 4px;
            flex: 1;
        }

        .edit-vol-btn {
            min-height: 36px;
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid #D1D5DB;
            background: #FFFFFF;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            flex-shrink: 0;
        }

        .expiry-line {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .expiry-line.urgent {
            color: var(--danger);
            font-weight: 800;
        }

        .bought-btn {
            width: 100%;
            min-height: 42px;
            border-radius: 12px;
            border: none;
            background: var(--success);
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .save-bar {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(160%);
            background: #18181B;
            color: #FFFFFF;
            padding: 12px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
            transition: transform 0.25s ease;
            z-index: 100;
            width: calc(100% - 24px);
            max-width: 460px;
        }

        .save-bar.visible {
            transform: translateX(-50%) translateY(0);
        }

        .save-actions {
            display: flex;
            gap: 8px;
        }

        .btn-confirm {
            min-height: 40px;
            padding: 8px 16px;
            border-radius: 12px;
            border: none;
            background: #10B981;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-cancel {
            min-height: 40px;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #52525B;
            background: transparent;
            color: #E4E4E7;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 200;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: #FFFFFF;
            padding: 20px;
            border-radius: 22px;
            width: 100%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 {
            font-size: 19px;
            margin-bottom: 14px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            border: 1.5px solid #D1D5DB;
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-main);
            background: #FFFFFF;
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .modal-foot {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-secondary {
            min-height: 44px;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid #D1D5DB;
            background: #FFFFFF;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 16px;
            color: var(--text-muted);
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div id="toastStack" class="toast-stack"></div>

    <header>
        <h1>🧊 Холодильник</h1>
        <button class="add-btn" onclick="openCreateModal()">+ Свой продукт</button>
    </header>

    <div class="tabs">
        <button class="tab-btn active" data-tab="in_stock" onclick="switchTab('in_stock')">В холодильнике</button>
        <button class="tab-btn" data-tab="to_buy" onclick="switchTab('to_buy')">Купить</button>
        <button class="tab-btn" data-tab="catalog" onclick="switchTab('catalog')">Все</button>
    </div>

    <div class="search-wrap">
        <input id="searchInput" class="search-input" type="search" placeholder="Поиск продукта в текущем разделе..." oninput="handleSearch()">
        <button id="searchClear" class="search-clear" onclick="clearSearch()">×</button>
    </div>

    <div id="subcats" class="subcats">
        <button class="subcat-btn active" data-sub="all" onclick="setSubcat('all')">Все</button>
        <button class="subcat-btn" data-sub="meat" onclick="setSubcat('meat')">Мясо</button>
        <button class="subcat-btn" data-sub="dairy" onclick="setSubcat('dairy')">Молочка</button>
        <button class="subcat-btn" data-sub="produce" onclick="setSubcat('produce')">Овощи и фрукты</button>
        <button class="subcat-btn" data-sub="pantry" onclick="setSubcat('pantry')">Бакалея и соусы</button>
        <button class="subcat-btn" data-sub="other" onclick="setSubcat('other')">Разное</button>
    </div>

    <div id="grid" class="grid">
        <div class="empty-state">Загрузка данных...</div>
    </div>

    <div id="saveBar" class="save-bar">
        <span style="font-size: 14px; font-weight: 700;">Есть несохранённые правки</span>
        <div class="save-actions">
            <button class="btn-cancel" onclick="discardChanges()">Отмена</button>
            <button class="btn-confirm" onclick="saveChanges()">Сохранить</button>
        </div>
    </div>

    <!-- Модалка объёма и срока годности -->
    <div id="actionModal" class="modal-overlay">
        <div class="modal">
            <h2 id="actionTitle">Параметры продукта</h2>
            <input type="hidden" id="actionItemId">
            <input type="hidden" id="actionMode">

            <div class="row-2">
                <div class="form-group">
                    <label>Количество</label>
                    <input type="number" step="0.1" min="0" id="actionAmount">
                </div>
                <div class="form-group">
                    <label>Единица измерения</label>
                    <select id="actionUnit">
                        <option value="шт">шт</option>
                        <option value="кг">кг</option>
                        <option value="г">г</option>
                        <option value="л">л</option>
                        <option value="мл">мл</option>
                        <option value="уп">уп</option>
                    </select>
                </div>
            </div>

            <div id="expiryField" class="form-group">
                <label>Годен до</label>
                <input type="date" id="actionExpiry">
            </div>

            <div class="modal-foot">
                <button type="button" class="btn-secondary" onclick="closeActionModal()">Отмена</button>
                <button type="button" class="add-btn" onclick="confirmActionModal()">Подтвердить</button>
            </div>
        </div>
    </div>

    <!-- Модалка создания своего продукта -->
    <div id="createModal" class="modal-overlay">
        <div class="modal">
            <h2>Новый продукт в каталог</h2>

            <div class="form-group">
                <label>Название</label>
                <input type="text" id="newName" placeholder="Например: Фарш говяжий или Кетчуп" oninput="autoPickArt()">
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label>Подкатегория в «Все»</label>
                    <select id="newSubcat">
                        <option value="meat">Мясо</option>
                        <option value="dairy">Молочка</option>
                        <option value="produce">Овощи и фрукты</option>
                        <option value="pantry">Бакалея и соусы</option>
                        <option value="other">Разное</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Картинка</label>
                    <select id="newArt">
                        <option value="beef">Корова (говядина)</option>
                        <option value="pork">Свинья (свинина)</option>
                        <option value="chicken">Курица / птица</option>
                        <option value="mince">Фарш</option>
                        <option value="fish">Рыба</option>
                        <option value="milk">Молоко</option>
                        <option value="eggs">Яйца</option>
                        <option value="cheese">Сыр</option>
                        <option value="butter">Масло</option>
                        <option value="ketchup">Кетчуп / соус</option>
                        <option value="spice">Специи / приправы</option>
                        <option value="veg">Овощи / фрукты</option>
                        <option value="grain">Крупы / макароны</option>
                        <option value="bread">Хлеб / выпечка</option>
                        <option value="drink">Напитки</option>
                    </select>
                </div>
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label>Объём по умолчанию</label>
                    <input type="number" step="0.1" min="0" id="newAmount" value="1">
                </div>
                <div class="form-group">
                    <label>Единица измерения</label>
                    <select id="newUnit">
                        <option value="шт">шт</option>
                        <option value="кг">кг</option>
                        <option value="г">г</option>
                        <option value="л">л</option>
                        <option value="мл">мл</option>
                        <option value="уп">уп</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Куда добавить сразу</label>
                <select id="newTarget">
                    <option value="catalog">Только в каталог «Все»</option>
                    <option value="to_buy">Сразу в «Купить»</option>
                    <option value="in_stock">Сразу в «В холодильнике»</option>
                </select>
            </div>

            <div class="modal-foot">
                <button type="button" class="btn-secondary" onclick="closeCreateModal()">Отмена</button>
                <button type="button" class="add-btn" onclick="createCustomItem()">Добавить</button>
            </div>
        </div>
    </div>

            milk: `<svg viewBox="0 0 36 36" fill="none"><path d="M12 11L15 6H21L24 11V29H12V11Z" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/><rect x="14" y="16" width="8" height="7" rx="1.5" fill="#93C5FD"/></svg>`,
            eggs: `<svg viewBox="0 0 36 36" fill="none"><ellipse cx="13.5" cy="19" rx="6.5" ry="8.5" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><ellipse cx="22.5" cy="20" rx="6" ry="7.5" fill="#FDE68A" stroke="#D97706" stroke-width="2"/></svg>`,
            cheese: `<svg viewBox="0 0 36 36" fill="none"><path d="M6 25L18 9L30 25H6Z" fill="#FACC15" stroke="#CA8A04" stroke-width="1.8" stroke-linejoin="round"/><circle cx="16" cy="20" r="1.6" fill="#CA8A04"/><circle cx="21" cy="22" r="1.3" fill="#CA8A04"/></svg>`,
            butter: `<svg viewBox="0 0 36 36" fill="none"><rect x="7" y="14" width="22" height="12" rx="3" fill="#FDE047" stroke="#CA8A04" stroke-width="1.8"/><path d="M11 14L14 10H25L29 14" fill="#FEF08A"/></svg>`,
            ketchup: `<svg viewBox="0 0 36 36" fill="none"><rect x="14" y="5" width="8" height="4" rx="1" fill="#334155"/><path d="M13 9H23L25 15V29H11V15L13 9Z" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5"/><rect x="13" y="17" width="10" height="7" fill="#FEF2F2"/></svg>`,
            spice: `<svg viewBox="0 0 36 36" fill="none"><circle cx="13" cy="14" r="2.2" fill="#D97706"/><circle cx="21" cy="12" r="2.5" fill="#65A30D"/><circle cx="18" cy="19" r="2.4" fill="#DC2626"/><circle cx="25" cy="18" r="2" fill="#CA8A04"/><circle cx="12" cy="22" r="2.4" fill="#16A34A"/><circle cx="20" cy="25" r="2.2" fill="#9A3412"/></svg>`,
            veg: `<svg viewBox="0 0 36 36" fill="none"><circle cx="14" cy="20" r="7" fill="#22C55E"/><circle cx="23" cy="21" r="6" fill="#EF4444"/><path d="M14 13V9M23 15V12" stroke="#15803D" stroke-width="2" stroke-linecap="round"/></svg>`,
            grain: `<svg viewBox="0 0 36 36" fill="none"><path d="M8 17H28C28 24 23.5 28 18 28C12.5 28 8 24 8 17Z" fill="#F59E0B"/><path d="M12 14C14 11 16 11 18 14C20 11 22 11 24 14" stroke="#D97706" stroke-width="2" stroke-linecap="round"/></svg>`,
            bread: `<svg viewBox="0 0 36 36" fill="none"><path d="M8 16C8 11.5 12.5 9 18 9C23.5 9 28 11.5 28 16V26H8V16Z" fill="#D97706" stroke="#92400E" stroke-width="1.6"/></svg>`,
            drink: `<svg viewBox="0 0 36 36" fill="none"><path d="M11 10H25L23 28H13L11 10Z" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.8"/><path d="M19 10L22 5" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/></svg>`
        };

        const DEFAULT_CATALOG = [
            { name: 'Молоко', subcat: 'dairy', art: 'milk', amount: 1, unit: 'л' },
            { name: 'Яйца', subcat: 'dairy', art: 'eggs', amount: 10, unit: 'шт' },
            { name: 'Сыр', subcat: 'dairy', art: 'cheese', amount: 300, unit: 'г' },
            { name: 'Сливочное масло', subcat: 'dairy', art: 'butter', amount: 180, unit: 'г' },
            { name: 'Говядина', subcat: 'meat', art: 'beef', amount: 1, unit: 'кг' },
            { name: 'Свинина', subcat: 'meat', art: 'pork', amount: 1, unit: 'кг' },
            { name: 'Курица', subcat: 'meat', art: 'chicken', amount: 1, unit: 'кг' },
            { name: 'Фарш говяжий', subcat: 'meat', art: 'mince', amount: 500, unit: 'г' },
            { name: 'Фарш свиной', subcat: 'meat', art: 'mince', amount: 500, unit: 'г' },
            { name: 'Рыба', subcat: 'meat', art: 'fish', amount: 600, unit: 'г' },
            { name: 'Кетчуп', subcat: 'pantry', art: 'ketchup', amount: 1, unit: 'шт' },
            { name: 'Специи и приправы', subcat: 'pantry', art: 'spice', amount: 1, unit: 'уп' },
            { name: 'Рис', subcat: 'pantry', art: 'grain', amount: 1, unit: 'кг' },
            { name: 'Гречка', subcat: 'pantry', art: 'grain', amount: 1, unit: 'кг' },
            { name: 'Макароны', subcat: 'pantry', art: 'grain', amount: 500, unit: 'г' },
            { name: 'Овощи и зелень', subcat: 'produce', art: 'veg', amount: 1, unit: 'кг' },
            { name: 'Хлеб', subcat: 'other', art: 'bread', amount: 1, unit: 'шт' },
            { name: 'Вода / напитки', subcat: 'other', art: 'drink', amount: 1.5, unit: 'л' }
        ];

        let originalItems = [];
        let draftItems = [];
        let deletedIds = [];
        let currentTab = 'in_stock';
        let currentSubcat = 'all';
        let searchQuery = '';
        let hasUnsavedChanges = false;
        let activeToasts = [];

        function renderArt(artKey) {
            return SVG_ART[artKey] || SVG_ART.veg;
        }

        function autoPickArt() {
            const name = document.getElementById('newName').value.toLowerCase();
            const artSel = document.getElementById('newArt');
            const subSel = document.getElementById('newSubcat');

            if (name.includes('говяд')) { artSel.value = 'beef'; subSel.value = 'meat'; return; }
            if (name.includes('свин')) { artSel.value = 'pork'; subSel.value = 'meat'; return; }
            if (name.includes('куриц') || name.includes('филе') || name.includes('бедр')) { artSel.value = 'chicken'; subSel.value = 'meat'; return; }
            if (name.includes('фарш')) { artSel.value = 'mince'; subSel.value = 'meat'; return; }
            if (name.includes('рыб') || name.includes('лосос') || name.includes('минтай')) { artSel.value = 'fish'; subSel.value = 'meat'; return; }
            if (name.includes('молок') || name.includes('кефир') || name.includes('йогурт')) { artSel.value = 'milk'; subSel.value = 'dairy'; return; }
            if (name.includes('яйц')) { artSel.value = 'eggs'; subSel.value = 'dairy'; return; }
            if (name.includes('сыр')) { artSel.value = 'cheese'; subSel.value = 'dairy'; return; }
            if (name.includes('масл')) { artSel.value = 'butter'; subSel.value = 'dairy'; return; }
            if (name.includes('кетчуп') || name.includes('соус') || name.includes('майонез')) { artSel.value = 'ketchup'; subSel.value = 'pantry'; return; }
            if (name.includes('спец') || name.includes('приправ') || name.includes('перец') || name.includes('соль')) { artSel.value = 'spice'; subSel.value = 'pantry'; return; }
            if (name.includes('рис') || name.includes('греч') || name.includes('макарон') || name.includes('овсян')) { artSel.value = 'grain'; subSel.value = 'pantry'; return; }
            if (name.includes('хлеб') || name.includes('булк') || name.includes('лаваш')) { artSel.value = 'bread'; subSel.value = 'other'; return; }
            if (name.includes('вод') || name.includes('сок') || name.includes('чай') || name.includes('кофе')) { artSel.value = 'drink'; subSel.value = 'other'; return; }
        }

        function normalizeItem(raw) {
            return {
                id: raw.id,
                name: raw.name || 'Без названия',
                icon: raw.icon || 'veg',
                amount: Number(raw.amount) || 0,
                unit: raw.unit || 'шт',
                status: raw.status || 'catalog',
                expiry: raw.expiry || null
            };
        }

        function parseSubcat(item) {
            if (item.expiry && item.expiry.startsWith('cat:')) {
                return item.expiry.slice(4);
            }
            if (['beef', 'pork', 'chicken', 'mince', 'fish'].includes(item.icon)) return 'meat';
            if (['milk', 'eggs', 'cheese', 'butter'].includes(item.icon)) return 'dairy';
            if (['veg'].includes(item.icon)) return 'produce';
            if (['ketchup', 'spice', 'grain'].includes(item.icon)) return 'pantry';
            return 'other';
        }

        function isExpiredOrSoon(dateStr) {
            if (!dateStr || dateStr.startsWith('cat:')) return { text: 'Срок не указан', urgent: false, expired: false };
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const exp = new Date(dateStr + 'T00:00:00');
            if (isNaN(exp.getTime())) return { text: 'Срок не указан', urgent: false, expired: false };
            const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
            const formatted = exp.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
            if (diffDays < 0) return { text: `Просрочено (${formatted})`, urgent: true, expired: true };
            if (diffDays <= 2) return { text: `До ${formatted} (скоро)`, urgent: true, expired: false };
            return { text: `До ${formatted}`, urgent: false, expired: false };
        }

        function clearAllToasts() {
            activeToasts.forEach(t => {
                if (t.timerId) clearTimeout(t.timerId);
                if (t.el && t.el.parentNode) t.el.remove();
            });
            activeToasts = [];
        }

        function removeToast(toastObj, animateOut = true) {
            if (!toastObj) return;
            if (toastObj.timerId) clearTimeout(toastObj.timerId);
            activeToasts = activeToasts.filter(t => t !== toastObj);
            if (!toastObj.el) return;
            if (!animateOut) {
                toastObj.el.remove();
                return;
            }
            toastObj.el.classList.add('leaving');
            setTimeout(() => {
                if (toastObj.el && toastObj.el.parentNode) toastObj.el.remove();
            }, 220);
        }

        function spawnDepletedToast(itemId, itemName, restoreAmount) {
            const stack = document.getElementById('toastStack');

            while (activeToasts.length >= MAX_TOASTS) {
                removeToast(activeToasts[0], true);
            }

            const el = document.createElement('div');
            el.className = 'toast-item';
            el.innerHTML = `
                <div class="toast-label">Добавить в «Купить»<br>«${itemName}»?</div>
                <button class="toast-yes" type="button">Да</button>
                <div class="toast-timer-track"><div class="toast-timer-bar"></div></div>
            `;

            const toastObj = { id: itemId, el, timerId: null };
            const yesBtn = el.querySelector('.toast-yes');
            const bar = el.querySelector('.toast-timer-bar');

            yesBtn.onclick = () => {
                const target = draftItems.find(i => i.id === itemId);
                if (target) {
                    target.status = 'to_buy';
                    target.amount = restoreAmount > 0 ? restoreAmount : 1;
                    setUnsaved(true);
                    render();
                }
                removeToast(toastObj, false);
            };

            stack.appendChild(el);
            activeToasts.push(toastObj);

            requestAnimationFrame(() => {
                el.classList.add('show');
                bar.style.transitionDuration = `${TOAST_DURATION_MS}ms`;
                requestAnimationFrame(() => {
                    bar.style.transform = 'scaleX(0)';
                });
            });

            toastObj.timerId = setTimeout(() => {
                removeToast(toastObj, true);
            }, TOAST_DURATION_MS);
        }

        async function fetchItems() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/fridge_items?select=*&order=id.asc`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                const data = await res.json();
                if (!Array.isArray(data)) throw new Error('Bad response');

                if (data.length === 0) {
                    await seedDefaultCatalog();
                    return;
                }

                const normalized = data.map(normalizeItem);
                originalItems = JSON.parse(JSON.stringify(normalized));
                draftItems = JSON.parse(JSON.stringify(normalized));
                deletedIds = [];
                clearAllToasts();
                setUnsaved(false);
                render();
            } catch (err) {
                document.getElementById('grid').innerHTML = '<div class="empty-state">Не удалось загрузить данные. Проверь настройки базы и интернет.</div>';
            }
        }

        async function seedDefaultCatalog() {
            for (const item of DEFAULT_CATALOG) {
                await fetch(`${SUPABASE_URL}/rest/v1/fridge_items`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: item.name,
                        icon: item.art,
                        amount: item.amount,
                        unit: item.unit,
                        status: 'catalog',
                        expiry: `cat:${item.subcat}`
                    })
                });
            }
            await fetchItems();
        }

        function setUnsaved(val) {
            hasUnsavedChanges = val;
            document.getElementById('saveBar').classList.toggle('visible', val);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });
            document.getElementById('subcats').classList.toggle('visible', tab === 'catalog');
            render();
        }

        function setSubcat(sub) {
            currentSubcat = sub;
            document.querySelectorAll('.subcat-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.sub === sub);
            });
            render();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            document.getElementById('searchClear').classList.toggle('visible', searchQuery.length > 0);
            render();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            document.getElementById('searchClear').classList.remove('visible');
            render();
        }

        function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            const items = draftItems.filter(item => {
                if (currentTab === 'in_stock' && item.status !== 'in_stock') return false;
                if (currentTab === 'to_buy' && item.status !== 'to_buy') return false;
                if (currentTab === 'catalog' && currentSubcat !== 'all' && parseSubcat(item) !== currentSubcat) return false;
                if (searchQuery && !item.name.toLowerCase().includes(searchQuery)) return false;
                return true;
            });

            if (items.length === 0) {
                grid.innerHTML = '<div class="empty-state">Здесь пока пусто</div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = `card ${item.status}`;

                if (currentTab === 'in_stock') {
                    const exp = isExpiredOrSoon(item.expiry);
                    if (exp.expired) card.classList.add('expired_card');
                    card.innerHTML = `
                        <div>
                            <div class="card-top">
                                <div class="art-box">${renderArt(item.icon)}</div>
                                <button class="edit-vol-btn" onclick="openActionModal(${item.id}, 'edit_stock')">Изм.</button>
                            </div>
                            <div class="card-title">${item.name}</div>
                        </div>
                        <div>
                            <div class="amount-row">
                                <button class="step-btn" onclick="stepAmount(${item.id}, -1)">−</button>
                                <span class="amount-text" onclick="openActionModal(${item.id}, 'edit_stock')">${item.amount} ${item.unit}</span>
                                <button class="step-btn" onclick="stepAmount(${item.id}, 1)">+</button>
                            </div>
                            <div class="expiry-line ${exp.urgent ? 'urgent' : ''}" onclick="openActionModal(${item.id}, 'edit_stock')" style="cursor:pointer;">
                                <span>${exp.text}</span>
                                <span>📅</span>
                            </div>
                        </div>
                    `;
                } else if (currentTab === 'to_buy') {
                    card.innerHTML = `
                        <div>
                            <div class="card-top">
                                <div class="art-box">${renderArt(item.icon)}</div>
                                <button class="del-x-btn" title="Убрать из списка" onclick="removeFromBuy(${item.id})">×</button>
                            </div>
                            <div class="card-title">${item.name}</div>
                        </div>
                        <div>
                            <div class="amount-row">
                                <span class="amount-text" style="text-align:left;padding-left:6px;">${item.amount} ${item.unit}</span>
                                <button class="edit-vol-btn" onclick="openActionModal(${item.id}, 'edit_buy')">Изм. объём</button>
                            </div>
                            <button class="bought-btn" onclick="openActionModal(${item.id}, 'mark_bought')">Куплено → в холодильник</button>
                        </div>
                    `;
                } else {
                    const stateText = item.status === 'in_stock' ? 'В холодильнике' : (item.status === 'to_buy' ? 'В списке «Купить»' : 'В каталоге');
                    card.innerHTML = `
                        <div>
                            <div class="card-top">
                                <div class="art-box">${renderArt(item.icon)}</div>
                                <span class="badge-tag">${stateText}</span>
                            </div>
                            <div class="card-title">${item.name}</div>
                        </div>
                        <div>
                            <button class="catalog-pick-btn" onclick="openActionModal(${item.id}, 'pick_to_buy')">+ В «Купить»</button>
                        </div>
                    `;
                }

                grid.appendChild(card);
            });
        }

        function stepAmount(id, dir) {
            const item = draftItems.find(i => i.id === id);
            if (!item) return;
            const step = (item.unit === 'кг' || item.unit === 'л') ? 0.5 : 1;
            const prevAmount = item.amount;
            const nextVal = Math.max(0, Math.round((item.amount + dir * step) * 100) / 100);

            if (dir < 0 && nextVal === 0 && item.status === 'in_stock') {
                const subcat = parseSubcat(item);
                item.amount = 0;
                item.status = 'catalog';
                item.expiry = `cat:${subcat}`;
                spawnDepletedToast(item.id, item.name, prevAmount > 0 ? prevAmount : 1);
                setUnsaved(true);
                render();
                return;
            }

            item.amount = nextVal;
            setUnsaved(true);
            render();
        }

        function removeFromBuy(id) {
            const item = draftItems.find(i => i.id === id);
            if (!item) return;
            item.status = 'catalog';
            item.expiry = `cat:${parseSubcat(item)}`;
            setUnsaved(true);
            render();
        }

        function openActionModal(id, mode) {
            const item = draftItems.find(i => i.id === id);
            if (!item) return;

            document.getElementById('actionItemId').value = id;
            document.getElementById('actionMode').value = mode;
            document.getElementById('actionAmount').value = item.amount > 0 ? item.amount : 1;
            document.getElementById('actionUnit').value = item.unit || 'шт';

            const expiryField = document.getElementById('expiryField');
            const expiryInput = document.getElementById('actionExpiry');

            if (mode === 'pick_to_buy') {
                document.getElementById('actionTitle').innerText = `Купить: ${item.name}`;
                expiryField.style.display = 'none';
            } else if (mode === 'edit_buy') {
                document.getElementById('actionTitle').innerText = `Объём покупки: ${item.name}`;
                expiryField.style.display = 'none';
            } else if (mode === 'mark_bought') {
                document.getElementById('actionTitle').innerText = `В холодильник: ${item.name}`;
                expiryField.style.display = 'block';
                expiryInput.value = (item.expiry && !item.expiry.startsWith('cat:')) ? item.expiry : '';
            } else {
                document.getElementById('actionTitle').innerText = `Изменить: ${item.name}`;
                expiryField.style.display = 'block';
                expiryInput.value = (item.expiry && !item.expiry.startsWith('cat:')) ? item.expiry : '';
            }

            document.getElementById('actionModal').classList.add('open');
        }

        function closeActionModal() {
            document.getElementById('actionModal').classList.remove('open');
        }

        function confirmActionModal() {
            const id = Number(document.getElementById('actionItemId').value);
            const mode = document.getElementById('actionMode').value;
            const item = draftItems.find(i => i.id === id);
            if (!item) return;

            const amt = Math.max(0, parseFloat(document.getElementById('actionAmount').value) || 0);
            const unit = document.getElementById('actionUnit').value;
            const expVal = document.getElementById('actionExpiry').value;

            item.amount = amt;
            item.unit = unit;

            if (mode === 'pick_to_buy' || mode === 'edit_buy') {
                item.status = 'to_buy';
                const matchedToast = activeToasts.find(t => t.id === id);
                if (matchedToast) removeToast(matchedToast, false);
            } else if (mode === 'mark_bought' || mode === 'edit_stock') {
                item.status = 'in_stock';
                item.expiry = expVal ? expVal : `cat:${parseSubcat(item)}`;
            }

            setUnsaved(true);
            closeActionModal();
            render();
        }

        function openCreateModal() {
            document.getElementById('newName').value = '';
            document.getElementById('newAmount').value = '1';
            document.getElementById('newUnit').value = 'шт';
            document.getElementById('newTarget').value = currentTab === 'to_buy' ? 'to_buy' : (currentTab === 'in_stock' ? 'in_stock' : 'catalog');
            document.getElementById('createModal').classList.add('open');
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.remove('open');
        }

        function createCustomItem() {
            const name = document.getElementById('newName').value.trim();
            if (!name) return alert('Введи название продукта');

            const subcat = document.getElementById('newSubcat').value;
            const art = document.getElementById('newArt').value;
            const amount = Math.max(0, parseFloat(document.getElementById('newAmount').value) || 0);
            const unit = document.getElementById('newUnit').value;
            const status = document.getElementById('newTarget').value;

            draftItems.push({
                id: -Date.now(),
                isNew: true,
                name,
                icon: art,
                amount,
                unit,
                status,
                expiry: `cat:${subcat}`
            });

            setUnsaved(true);
            closeCreateModal();
            render();
        }

        function discardChanges() {
            draftItems = JSON.parse(JSON.stringify(originalItems));
            deletedIds = [];
            clearAllToasts();
            setUnsaved(false);
            render();
        }

        async function saveChanges() {
            const btn = document.querySelector('.btn-confirm');
            btn.disabled = true;
            btn.innerText = 'Сохранение...';

            try {
                for (const id of deletedIds) {
                    await fetch(`${SUPABASE_URL}/rest/v1/fridge_items?id=eq.${id}`, {
                        method: 'DELETE',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    });
                }

                for (const item of draftItems) {
                    const payload = {
                        name: item.name,
                        icon: item.icon,
                        amount: item.amount,
                        unit: item.unit,
                        status: item.status,
                        expiry: item.expiry
                    };

                    if (item.isNew) {
                        await fetch(`${SUPABASE_URL}/rest/v1/fridge_items`, {
                            method: 'POST',
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });
                    } else {
                        await fetch(`${SUPABASE_URL}/rest/v1/fridge_items?id=eq.${item.id}`, {
                            method: 'PATCH',
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });
                    }
                }

                await fetchItems();
            } catch (e) {
                alert('Ошибка при сохранении. Проверь подключение к сети.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Сохранить';
            }
        }

        fetchItems();
    </script>
</body>
</html>
